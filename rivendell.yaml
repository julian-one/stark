apiVersion: v1
kind: ServiceAccount
metadata:
  name: rivendell
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rivendell
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - pods
      - events
    verbs:
      - get
      - list
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rivendell
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rivendell
subjects:
  - kind: ServiceAccount
    name: rivendell
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rivendell
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rivendell
  template:
    metadata:
      labels:
        app: rivendell
    spec:
      enableServiceLinks: false
      serviceAccountName: rivendell
      containers:
        - name: rivendell
          image: julianone/rivendell:latest
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: rivendell
spec:
  selector:
    app: rivendell
  ports:
    - port: 80
      targetPort: 8082

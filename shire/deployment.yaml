---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shire
  namespace: industries
  labels:
    app: shire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shire
  template:
    metadata:
      labels:
        app: shire
    spec:
      enableServiceLinks: false
      containers:
        - name: shire
          image: julianone/shire:latest
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
          env:
            - name: MORIA_API_URL
              value: http://moria.industries.svc.cluster.local
            - name: ORIGIN
              value: https://julian-one.com
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shire
  namespace: industries
  labels:
    app: shire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shire
  template:
    metadata:
      labels:
        app: shire
    spec:
      containers:
        - name: shire
          image: julianone/shire:latest
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
          env:
            - name: PUBLIC_CITADEL_API_URL
              value: https://api.julian-one.com
            - name: PUBLIC_MORIA_API_URL
              value: https://auth.julian-one.com
            - name: ADDRESS_HEADER
              value: X-Forwarded-For
            - name: XFF_DEPTH
              value: "1"
            - name: GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: shire-secrets
                  key: GRAFANA_USER
            - name: GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shire-secrets
                  key: GRAFANA_PASSWORD

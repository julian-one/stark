---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: monitoring
data:
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: 'loki-alerts'
        folder: 'Loki Alerts'
        interval: 60s
        rules:
          - uid: 'high-error-rate'
            title: 'High Error Rate'
            condition: 'B'
            data:
              - refId: 'A'
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: 'Loki'
                model:
                  expr: 'sum(rate({namespace=~".+"} |= "error"[5m]))'
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: 'A'
                  type: 'query'
              - refId: 'B'
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: '-100'
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.5
                        type: 'gt'
                      operator:
                        type: 'and'
                      query:
                        params:
                          - 'A'
                      reducer:
                        params: []
                        type: 'last'
                      type: 'query'
                  expression: 'A'
                  refId: 'B'
                  type: 'classic_conditions'
            noDataState: 'NoData'
            execErrState: 'Error'
            for: '2m'
            annotations:
              summary: 'High error rate detected in cluster logs'
              description: 'The rate of error logs in the cluster has exceeded the warning threshold over a 5-minute window.'
            labels:
              severity: 'critical'
          - uid: 'pod-crash-termination'
            title: 'Pod Crash or Termination Warning'
            condition: 'B'
            data:
              - refId: 'A'
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: 'Loki'
                model:
                  expr: 'sum(rate({namespace=~".+"} |~ "(?i)panic|exit code|CrashLoopBackOff"[5m]))'
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: 'A'
                  type: 'query'
              - refId: 'B'
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: '-100'
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: 'gt'
                      operator:
                        type: 'and'
                      query:
                        params:
                          - 'A'
                      reducer:
                        params: []
                        type: 'last'
                      type: 'query'
                  expression: 'A'
                  refId: 'B'
                  type: 'classic_conditions'
            noDataState: 'NoData'
            execErrState: 'Error'
            for: '2m'
            annotations:
              summary: 'Pod crash or termination log detected'
              description: 'A pod has logged messages containing "panic", "exit code", or "CrashLoopBackOff" in the last 5 minutes.'
            labels:
              severity: 'warning'

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: citadel-gridsearch
  namespace: industries
spec:
  schedule: "0 0 * * 0" # Midnight every Sunday
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: jarvis
          containers:
            - name: gridsearch
              image: julianone/citadel:latest
              command:
                - /app/citadel
                - gridsearch
              imagePullPolicy: Always
              env:
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: citadel-secrets
                      key: ANTHROPIC_API_KEY
                - name: RESEND_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: citadel-secrets
                      key: RESEND_API_KEY
                - name: HMAC_SIGNING_KEY
                  valueFrom:
                    secretKeyRef:
                      name: citadel-secrets
                      key: HMAC_SIGNING_KEY
                - name: ALPACA_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: citadel-secrets
                      key: ALPACA_SECRET
                - name: ALPACA_KEY
                  valueFrom:
                    secretKeyRef:
                      name: citadel-secrets
                      key: ALPACA_KEY
              volumeMounts:
                - name: citadel-data
                  mountPath: /app/data
                - name: citadel-config
                  mountPath: /app/config.json
                  subPath: config.json
          volumes:
            - name: citadel-data
              hostPath:
                path: /data/citadel
                type: DirectoryOrCreate
            - name: citadel-config
              configMap:
                name: citadel-config

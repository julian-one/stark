# Pre-staged into /var/lib/rancher/k3s/server/manifests before k3s installs
# (runbook step 8) — never `kubectl apply` it. Must not be named traefik.yaml.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
    nodeSelector:
      kubernetes.io/hostname: jarvis
    persistence:
      enabled: true
      size: 128Mi
      path: /data
    deployment:
      initContainers:
        - name: volume-permissions
          image: busybox:1.37
          command: ["sh", "-c", "touch /data/acme.json && chmod 600 /data/acme.json && chown 65532:65532 /data/acme.json"]
          volumeMounts:
            - name: data
              mountPath: /data
    additionalArguments:
      - "--certificatesresolvers.letsencrypt.acme.email=julian.roberts.one@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: moria-db-backup
  namespace: industries
spec:
  schedule: "10 4 * * *"
  successfulJobsHistoryLimit: 0
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: jarvis
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:latest
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache sqlite
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  mkdir -p /data/backups
                  sqlite3 /data/moria.db ".backup '/data/backups/moria-${TIMESTAMP}.db'"
                  ls -t /data/backups/moria-*.db | tail -n +8 | xargs -r rm
              volumeMounts:
                - name: moria-data
                  mountPath: /data
          volumes:
            - name: moria-data
              hostPath:
                path: /data/moria
                type: DirectoryOrCreate

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moria
  namespace: industries
  labels:
    app: moria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moria
  template:
    metadata:
      labels:
        app: moria
    spec:
      # The moria Service makes k8s inject MORIA_PORT=tcp://... which
      # viper's MORIA_ env prefix reads as the port key. Keep these off.
      enableServiceLinks: false
      containers:
        - name: moria
          image: julianone/moria:latest
          ports:
            - containerPort: 8081
          imagePullPolicy: Always
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
          livenessProbe:
            httpGet:
              path: /health
              port: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moria
  namespace: industries
  labels:
    app: moria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moria
  template:
    metadata:
      labels:
        app: moria
    spec:
      nodeSelector:
        kubernetes.io/hostname: jarvis
      containers:
        - name: moria
          image: julianone/moria:latest
          ports:
            - containerPort: 8081
            - containerPort: 8082
          imagePullPolicy: Always
          env:
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moria-secrets
                  key: RESEND_API_KEY
            - name: HMAC_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: moria-secrets
                  key: HMAC_SIGNING_KEY
          volumeMounts:
            - name: moria-data
              mountPath: /app/data
            - name: moria-config
              mountPath: /app/config.json
              subPath: config.json
      volumes:
        - name: moria-data
          hostPath:
            path: /data/moria
            type: DirectoryOrCreate
        - name: moria-config
          configMap:
            name: moria-config

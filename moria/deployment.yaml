---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moria
  namespace: industries
spec:
  # SQLite takes exactly one writer and every pod generation mounts the same
  # hostPath, so an overlapping rolling update would put two on one file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: moria
  template:
    metadata:
      labels:
        app: moria
    spec:
      # hostPath is node-local: the database exists only on jarvis. Never
      # unpin this and never scale up — a pod landing on friday would come
      # up healthy against an empty database instead of failing.
      nodeSelector:
        kubernetes.io/hostname: jarvis
      initContainers:
        # DirectoryOrCreate makes /data/moria root-owned; moria runs as
        # distroless nonroot (65532) and cannot write it otherwise.
        - name: data-permissions
          image: busybox:1.37
          command:
            ["sh", "-c", "chown 65532:65532 /app/data && chmod 700 /app/data"]
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: moria
          image: julianone/moria:latest
          env:
            - name: MORIA_DATABASE_PATH
              value: /app/data/moria.db
            # Re-applied at every boot against a database that now survives:
            # safe only because the seed is INSERT OR IGNORE, so existing
            # rows (including changed passwords) are left alone.
            - name: MORIA_SEED_PATH
              value: /app/seed/seeding.sql
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: seed
              mountPath: /app/seed
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
      volumes:
        - name: data
          hostPath:
            path: /data/moria
            type: DirectoryOrCreate
        - name: seed
          secret:
            secretName: moria-seed
